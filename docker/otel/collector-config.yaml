receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

connectors:
  spanmetrics:
    namespace: drupal
    metrics_flush_interval: 5s

exporters:
  debug:
    verbosity: detailed

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:

    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
        - otlp/tempo
        - spanmetrics

    metrics:
      receivers:
        - otlp
        - spanmetrics
      processors:
        - batch
      exporters:
        - debug
        - prometheus

    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug