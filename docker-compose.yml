services:

  drupal:
    build:
      context: .
      dockerfile: docker/drupal/Dockerfile

    container_name: observability-drupal

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      PHP_MEMORY_LIMIT: 512M

    volumes:
      - ./drupal:/var/www/html
      - drupal_files:/var/www/html/web/sites/default/files

    networks:
      - observability

  nginx:
    image: nginx:1.27-alpine

    container_name: observability-nginx

    depends_on:
      - drupal

    ports:
      - "8080:80"

    volumes:
      - ./drupal:/var/www/html:ro
      - drupal_files:/var/www/html/web/sites/default/files
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - observability

  mysql:
    image: mysql:8.0

    container_name: observability-mysql

    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0

    container_name: observability-otel-collector

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./docker/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"

    networks:
      - observability

  tempo:
    image: grafana/tempo:2.8.2

    container_name: observability-tempo

    command:
      - "-config.file=/tmp/tempo.yaml"

    volumes:
      - ./docker/tempo/tempo.yaml:/tmp/tempo.yaml:ro
      - tempo_data:/var/tempo

    ports:
      - "3200:3200"

    networks:
      - observability
    
  grafana:
    image: grafana/grafana:12.1.1

    container_name: observability-grafana

    depends_on:
      - tempo
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro

    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.8.0

    container_name: observability-prometheus

    depends_on:
      - otel-collector

    ports:
      - "9090:9090"

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - observability

  loki:
    image: grafana/loki:3.5.0

    container_name: observability-loki

    command:
      - "-config.file=/etc/loki/loki.yaml"

    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

    ports:
      - "3100:3100"

    networks:
      - observability

  alloy:
    image: grafana/alloy:latest

    container_name: observability-alloy

    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"

    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      - "12345:12345"

    depends_on:
      - loki

    networks:
      - observability

volumes:
  mysql_data:
  drupal_files:
  tempo_data:
  grafana_data:
  prometheus_data:
  loki_data:

networks:
  observability:
    driver: bridge